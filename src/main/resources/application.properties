spring.application.name=OfficeManagement
server.port=${PORT:8080}

# Database Configuration
# Use PostgreSQL if environment variables are provided, otherwise fallback to local H2
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/office_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console (Disable in production for security)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false

logging.level.org.springframework.web=DEBUG
