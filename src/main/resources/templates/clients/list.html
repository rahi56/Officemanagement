<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">

<head>
    <title>Clients - Office Management</title>
</head>

<body>
    <div th:fragment="content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1 class="card-title" style="font-size: 2rem; margin: 0;">Clients</h1>
            <a th:href="@{/clients/new}" class="btn btn-primary">+ New Client</a>
        </div>

        <div class="card">
            <table class="table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="client : ${clients}">
                        <td>
                            <a th:href="@{/clients/{id}(id=${client.id})}" th:text="${client.name}"
                                style="font-weight: 600; text-decoration: none; color: var(--primary-color);">Name</a>
                        </td>
                        <td th:text="${client.phone}">Phone</td>
                        <td th:text="${client.email}">Email</td>
                        <td>
                            <span th:text="${client.status}"
                                style="padding: 0.25rem 0.5rem; background: #e0f2fe; color: #0369a1; border-radius: 9999px; font-size: 0.875rem;">Status</span>
                        </td>
                        <td>
                            <a th:href="@{/clients/edit/{id}(id=${client.id})}" class="btn"
                                style="background: #f3f4f6; color: #4b5563; margin-right: 0.5rem;">Edit</a>
                            <a th:href="@{/clients/delete/{id}(id=${client.id})}" class="btn btn-danger"
                                onclick="return confirm('Are you sure?')">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(clients)}">
                        <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">No clients
                            found. Add one to get started!</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
