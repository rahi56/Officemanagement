<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">

<head>
    <title>Client Form - Office Management</title>
</head>

<body>
    <div th:fragment="content">
        <div style="margin-bottom: 2rem;">
            <a th:href="@{/clients}" style="color: var(--text-muted); text-decoration: none;">&larr; Back to Clients</a>
        </div>

        <h1 class="card-title" style="font-size: 2rem; margin-bottom: 2rem;"
            th:text="${client.id == null ? 'New Client' : 'Edit Client'}">Client</h1>

        <div class="card" style="max-width: 800px;">
            <form th:action="@{/clients/save}" th:object="${client}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" th:field="*{name}" required />
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" th:field="*{email}" />
                    </div>

                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" th:field="*{phone}" />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Channel Name</label>
                    <input type="text" class="form-control" th:field="*{channelName}"
                        placeholder="e.g. YouTube, Referral, etc." />
                </div>

                <div class="form-group">
                    <label class="form-label">Address</label>
                    <input type="text" class="form-control" th:field="*{address}" />
                </div>

                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select class="form-control" th:field="*{status}">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                        <option value="Lead">Lead</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Notes</label>
                    <textarea class="form-control" th:field="*{notes}" rows="4"></textarea>
                </div>

                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary">Save Client</button>
                    <a th:href="@{/clients}" class="btn"
                        style="background: #f3f4f6; color: #4b5563; margin-left: 0.5rem;">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
