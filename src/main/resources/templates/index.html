<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">

<head>
    <title>Dashboard - Office Management</title>
</head>

<body>
    <div th:fragment="content">
        <h1 class="card-title" style="font-size: 2rem; margin-bottom: 2rem;">Dashboard</h1>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" th:text="${totalClients}">0</div>
                <div class="stat-label">Total Clients</div>
            </div>

            <div class="stat-card">
                <div class="stat-value">$0.00</div>
                <div class="stat-label">Total Revenue (This Month)</div>
            </div>

            <div class="stat-card">
                <div class="stat-value">0</div>
                <div class="stat-label">Pending Quotations</div>
            </div>
        </div>
        +
        + <div class="card"
            style="display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #2563eb, #1e40af); color: white;">
            + <div>
                + <h2 class="card-title" style="margin-bottom: 0.5rem; color: white;">Official Office Site</h2>
                + <p style="opacity: 0.9;">Access the KiteGlobal KG official website for more resources.</p>
                + </div>
            + <a href="https://www.kiteglobalkg.com/" target="_blank" class="btn"
                style="background: white; color: var(--primary-color);">Visit Website</a>
            + </div>

        <div class="card">
            <h2 class="card-title">Recent Activity</h2>
            <p class="text-muted">No recent activity.</p>
        </div>
    </div>
</body>

</html>
